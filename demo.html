<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="demo.css">
</head>
<body>

    <div class="container hero-inner">
    <!-- Big background text -->
    <h6 class="tourvia">TOURVIA</h6>

    <!-- Mountain image layered on top of text -->
    <img src="./assest/mountain-img.webp" alt="" class="mountain">

    <!-- Bottom content: badge + heading -->
    <div class="hero-content">
        <div class="welcome-badge">— Welcome to Tourvia</div>
        <p class="hero-heading">Explore Beyond The <br> Map With Tourvia</p>
        <button class="explore-btn">
            Explore Destination
            <span class="explore-icon">↗</span>
        </button>
    </div>
</div>
    
<div class="row g-4 mb-5">
    <div class="col-12 col-md-4">
        <div class="destination-card">
            <img src="./assest/destination-img.webp" alt="Imperial Tokyo">
            <span class="destination-badge">Japan</span>
            <div class="destination-info">
                <h5>Imperial Tokyo</h5>
                <p>05 Visited Place</p>
            </div>
        </div>
    </div>
    <div class="col-12 col-md-4">
        <div class="destination-card">
            <img src="./assest/destination-img2.webp" alt="Kananaskis Country">
            <span class="destination-badge">Canada</span>
            <div class="destination-info">
                <h5>Kananaskis Country</h5>
                <p>03 Visited Place</p>
            </div>
        </div>
    </div>
    <div class="col-12 col-md-4">
        <div class="destination-card">
            <img src="./assest/destination-img3.webp" alt="Burj Khalifa">
            <span class="destination-badge">Dubai</span>
            <div class="destination-info">
                <h5>Burj Khalifa</h5>
                <p>02 Visited Place</p>
            </div>
        </div>
    </div>
</div>

<div class="row mt-5">
                    <div class="col-12 col-md-5">
                        <h4 class="text-white">© 2026 Tourvia. All Rights Reserved.</h4>
                    </div>

                    <div class="col-12 col-md-5">
                        <ul class="text-white d-flex gap-4 footer-link">
                        <li>Style Guide</li>
                        <li>Licenses</li>
                        <li> Changelog</li>
                        
                        </ul>
                    </div>

                    

                </div>
</body>
</html>
